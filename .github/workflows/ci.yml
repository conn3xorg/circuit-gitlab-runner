name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu2404, debian13, rocky10]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_runner_token: glrt-ci-only-not-a-real-token
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          if grep -q ci-only terraform.tfstate; then exit 1; fi
      # There's no GitLab here, so the runner can't take a job. The check is
      # that the pinned packages are in, the service runs jobs as
      # gitlab-runner, and the runner loaded the config.toml the circuit
      # wrote: its runner, and the example's concurrent = 2.
      - name: Check the runner and its config
        run: |
          sudo podman exec -i circuit-gitlab-runner sh -eu <<'EOF'
          if command -v rpm >/dev/null && ! command -v dpkg >/dev/null; then
            rpm -q gitlab-runner-19.5.2 gitlab-runner-helper-images-19.5.2
          else
            [ "$(dpkg-query -W -f '${Version}' gitlab-runner)" = 19.5.2-1 ]
            [ "$(dpkg-query -W -f '${Version}' gitlab-runner-helper-images)" = 19.5.2-1 ]
          fi
          systemctl is-active gitlab-runner
          systemctl show -p ExecStart gitlab-runner | grep -q -- '--user gitlab-runner'
          [ "$(stat -c '%U %a' /etc/gitlab-runner/config.toml)" = "root 600" ]
          gitlab-runner list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -q 'box.*Executor=shell.*URL=https://gitlab.example.com'
          for _ in $(seq 30); do
            journalctl -u gitlab-runner -o cat | sed 's/\x1b\[[0-9;]*m//g' | grep -q 'Configuration loaded.*max_builds=2' && exit 0
            sleep 1
          done
          exit 1
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
